---
# Darkian Linux - desktop environment chooser (Calamares).
#
# The live session always runs KDE Plasma; this step only controls which
# desktop environment(s) get installed onto the target system. The KDE
# option is already present in the image and installs nothing extra.
# The other options pull their packages from the Debian mirrors, so they
# need an internet connection during installation.

mode: required
method: packages

labels:
    step: "Desktop"

# Pre-select the Darkian default (KDE Plasma, already in the image).
default: kde

items:
    - id: kde
      name: "KDE Plasma (default)"
      description: "The Darkian default desktop. Simple by default and powerful when needed - it is already included, so nothing extra is downloaded."

    - id: gnome
      packages: [ task-gnome-desktop, gdm3 ]
      name: "GNOME"
      description: "A modern, touch-friendly desktop focused on simplicity and ease of use. Needs internet; installs GNOME alongside KDE Plasma."

    - id: xfce
      packages: [ task-xfce-desktop, lightdm ]
      name: "Xfce"
      description: "A fast, lightweight desktop that is easy on system resources while staying visually appealing. Needs internet; installs alongside KDE Plasma."

    - id: cinnamon
      packages: [ task-cinnamon-desktop, lightdm ]
      name: "Cinnamon"
      description: "A traditional desktop with a familiar layout and modern features. Needs internet; installs alongside KDE Plasma."

    - id: mate
      packages: [ task-mate-desktop, lightdm ]
      name: "MATE"
      description: "A classic, intuitive desktop continuing the GNOME 2 tradition. Needs internet; installs alongside KDE Plasma."

    - id: lxqt
      packages: [ task-lxqt-desktop ]
      name: "LXQt"
      description: "A lightweight Qt-based desktop with a classic feel and a small footprint. Needs internet; installs alongside KDE Plasma."
