---
# Darkian Linux - desktop environment chooser (Calamares).
#
# The live session always runs KDE Plasma; this step decides which desktop
# environment the *target* system ends up with. KDE Plasma is already present
# in the image, so choosing it installs nothing and works fully offline. Any
# other option downloads its packages from the Debian mirrors and then removes
# KDE Plasma, so the chosen desktop is the *only* one installed. Those options
# therefore need an internet connection during installation.

mode: required
method: legacy

labels:
    step: "Desktop"

# Pre-select the Darkian default (KDE Plasma, already in the image).
default: kde

items:
    - id: kde
      name: "KDE Plasma (default)"
      description: "The Darkian default desktop - simple by default and powerful when needed. It is already included, so nothing extra is downloaded."

    - id: gnome
      name: "GNOME"
      description: "A modern, touch-friendly desktop. Needs internet: GNOME is downloaded from the mirrors and replaces KDE Plasma."

    - id: xfce
      name: "Xfce"
      description: "A light, fast desktop that is easy on resources. Needs internet: Xfce is downloaded and replaces KDE Plasma."

    - id: cinnamon
      name: "Cinnamon"
      description: "A modern desktop with a familiar, traditional layout. Needs internet: Cinnamon is downloaded and replaces KDE Plasma."

    - id: mate
      name: "MATE"
      description: "A classic, traditional desktop. Needs internet: MATE is downloaded and replaces KDE Plasma."

    - id: lxqt
      name: "LXQt"
      description: "A lightweight Qt desktop. Needs internet: LXQt is downloaded and replaces KDE Plasma."
