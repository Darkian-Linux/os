---
# Darkian Linux - Calamares welcome page requirements.
#
# The *internet* check is listed so the welcome module probes for
# connectivity and records the result in GlobalStorage (hasInternet).
# The packages module uses that flag to decide whether to run apt-get
# update, which non-KDE desktop installs rely on. It is not a hard
# requirement, so a KDE install still works fully offline.
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    15
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
        - internet
    required:
        - storage
        - ram
        - root
