---
# Darkian Linux - partitioning (Calamares).
#
# Adds a filesystem picker to the "Erase disk" option: when more than one type
# is listed in availableFileSystemTypes, the erase button lets the user choose
# which filesystem to create. ZFS is intentionally excluded (no in-ISO mkfs.zfs
# / ZFS tooling). Swap defaults to the built-in "small" suggestion, which is a
# ~8 GiB swap partition on typical systems (2x RAM, capped at 8 GiB / 10% disk).
defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - "ext4"
    - "btrfs"
    - "xfs"
    - "f2fs"
    - "jfs"

# Offer a swap choice and default to the small (~8 GiB) swap partition.
userSwapChoices:
    - "none"
    - "small"
    - "suspend"
    - "file"
initialSwapChoice: "small"
