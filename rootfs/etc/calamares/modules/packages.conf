---
# Darkian Linux - package operations for the installed system.
#
# update_db is required so that non-KDE desktop environments selected in
# the packagechooser step can be fetched from the Debian mirrors during
# installation. The removals strip the live-boot/live-config machinery
# and the Calamares settings package from the installed system.
backend: apt

update_db: true

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
