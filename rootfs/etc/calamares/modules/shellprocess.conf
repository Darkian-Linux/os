---
# Darkian Linux - make the login manager match the installed desktop.
#
# Runs *after* the packages module, once the chosen desktop environment
# (and its display manager) have been installed. If a more specific
# display manager than SDDM is present, it becomes the default one.
dontChroot: false
timeout: 60
verbose: true
script: "sh /usr/local/bin/darkian-set-default-dm"
