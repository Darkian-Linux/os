---
# Darkian Linux - act on the desktop environment chosen in the chooser.
#
# The packagechooser step (method: legacy) stores the selected item id in the
# global-storage key "packagechooser_packagechooser". KDE Plasma is already in
# the image, so "kde" is a no-op; every other desktop is downloaded from the
# Debian mirrors and KDE Plasma is then removed by darkian-install-desktop, so
# the chosen desktop ends up as the only one installed.
dontChroot: false
timeout: 7200
packagechooser_packagechooser:
    kde: "/bin/true"
    gnome: "sh /usr/local/bin/darkian-install-desktop gnome"
    xfce: "sh /usr/local/bin/darkian-install-desktop xfce"
    cinnamon: "sh /usr/local/bin/darkian-install-desktop cinnamon"
    mate: "sh /usr/local/bin/darkian-install-desktop mate"
    lxqt: "sh /usr/local/bin/darkian-install-desktop lxqt"
